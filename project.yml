name: HealthMi
options:
  bundleIdPrefix: com.healthmi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # 不写死团队 ID：真机签名时在 Xcode 中选择自己的开发团队
    ENABLE_TESTABILITY: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  HealthMi:
    type: application
    platform: iOS
    sources:
      - path: HealthMi
        excludes:
          - "Support/Info.plist"
    dependencies:
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthmi.HealthMi
        PRODUCT_NAME: HealthMi
        INFOPLIST_FILE: HealthMi/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: HealthMi/Support/HealthMi.entitlements
      properties:
        com.apple.developer.healthkit: true

  HealthMiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthMiTests
    dependencies:
      - target: HealthMi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthmi.HealthMiTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HealthMi.app/HealthMi"
        BUNDLE_LOADER: "$(TEST_HOST)"
